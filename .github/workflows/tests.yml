name: Compiler and runtime checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  pytest:
    name: Tests (${{ matrix.os }}, ${{ matrix.optimization }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        optimization: ['-O0', '-O2']
    env:
      PYTHONUTF8: '1'
      PB_CFLAGS: ${{ matrix.optimization }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install GCC on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc
      - name: Install pinned GCC on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'w64devkit.exe'
          Invoke-WebRequest 'https://github.com/skeeto/w64devkit/releases/download/v2.10.0/w64devkit-x64-2.10.0.7z.exe' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '18d0a4c71a166f8401ab6305781bec5882b40b5e06ba9807c61cb5f3b3c6325e') { throw 'Toolchain checksum mismatch' }
          $process = Start-Process -FilePath $archive -ArgumentList '-y', "-o$env:RUNNER_TEMP" -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Toolchain extraction failed' }
          Join-Path $env:RUNNER_TEMP 'w64devkit/bin' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Build runtime library
        run: python src/main.py buildlib
      - name: Run tests
        run: python -m pytest -q
      - name: Check benchmark outputs
        run: python benchmark/pb_bench.py --quick --repeats 1 --optimization=${{ matrix.optimization }}
      - name: Build bundled native Pong example
        if: runner.os == 'Windows'
        run: python run.py build examples/ray_pong.pb
